name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Explicit permissions required for GitHub Pages deployment via OIDC tokens
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency group to ensure single, zero-downtime ordered deployments without race conditions
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Stage 1: Build & Package Artifacts
  # =========================================================================
  build:
    name: Build & Package Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Metadata
        uses: actions/configure-pages@v5

      - name: Validate Web Assets
        run: |
          echo "Validating core web assets..."
          test -f index.html || { echo "Missing index.html"; exit 1; }
          test -f styles.css || { echo "Missing styles.css"; exit 1; }
          test -f script.js || { echo "Missing script.js"; exit 1; }
          echo "All static assets verified successfully."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # =========================================================================
  # Stage 2: Zero-Downtime Deployment
  # =========================================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (OIDC Authenticated)
        id: deployment
        uses: actions/deploy-pages@v4
